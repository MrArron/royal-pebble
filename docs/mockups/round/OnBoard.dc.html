<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round On board confirm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 520px; height: 520px; position: relative; background: #1E1E1E; font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 520px; height: 520px; border-radius: 50%; overflow: hidden; background: #FFFFFF; color: #000000">
<div style="height: 60px; background: #005555; color: #FFFFFF; font-size: 28px; line-height: 28px; font-weight: 700; text-align: center; padding-top: 24px; box-sizing: border-box">2:40p</div>
<div style="position: absolute; left: 0; width: 520px; top: 66px; text-align: center; font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: 1px; color: #555555">COCOCAY · DOCKED</div>
<div style="position: absolute; left: 90px; top: 120px; width: 340px; display: flex; flex-direction: column; align-items: center; text-align: center">
<div style="font-size: 48px; line-height: 52px; font-weight: 700">On board?</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700; color: #555555; margin-top: 6px">Ends today's countdown</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700; color: #555555">All-aboard alerts off.</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700; color: #555555">Undo in My info.</div>
</div>
<div style="position: absolute; left: 22px; top: 238px; font-size: 26px; line-height: 30px; font-weight: 700; color: #555555">‹ Not yet</div>
<div style="position: absolute; right: 44px; top: 352px; height: 44px; padding: 0 18px; border-radius: 22px; background: #0055AA; color: #FFFFFF; display: flex; align-items: center; font-size: 26px; font-weight: 700">Hold: yes ›</div>
</div>
<sc-if value="{{safe}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 76px; top: 76px; width: 368px; height: 368px; border: 2px dashed #FF5555; box-sizing: border-box"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"safe":{"editor":"boolean","default":false},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return { safe: this.props.safe ?? false };
}
}
</script>
</body>
</html>
