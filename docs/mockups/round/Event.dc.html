<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round event details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 520px; height: 520px; position: relative; background: #1E1E1E; font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 520px; height: 520px; border-radius: 50%; overflow: hidden; background: #FFFFFF; color: #000000">
<div style="height: 60px; background: #000055; color: #FFFFFF; font-size: 28px; line-height: 28px; font-weight: 700; text-align: center; padding-top: 24px; box-sizing: border-box">8:40p</div>
<div style="position: absolute; left: 0; width: 520px; top: 66px; text-align: center; font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: 1px; color: #555555">EVENT</div>
<div style="position: absolute; left: 50px; top: 96px; width: 420px; display: flex; flex-direction: column; align-items: center; text-align: center">
<div style="font-size: 48px; line-height: 50px; font-weight: 700">Late Night Comedy</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700; color: #555555">Comedy Live</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700">Deck 4 · Fore</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700; color: #555555">↓5 decks from cabin</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700">10:00p - 11:00p · 1 h</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700">Arrive by 9:45p</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700; color: #AA5500">Ages 18+</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700; color: #555555">Bring SeaPass · Sign up at venue</div>
</div>
<svg width="520" height="520" viewBox="0 0 520 520" aria-hidden="true" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round"><path d="M461.5 118.8 A246 246 0 0 1 461.5 401.2" stroke="#AAAAAA" stroke-width="4"></path><path d="M461.5 118.8 A246 246 0 0 1 502.3 217.3" stroke="#555555" stroke-width="8"></path></svg>
</div>
<sc-if value="{{safe}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 76px; top: 76px; width: 368px; height: 368px; border: 2px dashed #FF5555; box-sizing: border-box"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"safe":{"editor":"boolean","default":false},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return { safe: this.props.safe ?? false };
}
}
</script>
</body>
</html>
