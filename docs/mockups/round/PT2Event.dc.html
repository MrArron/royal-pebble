<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time 2 event details with a scroll bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 456px; box-sizing: border-box; overflow: hidden; background: #FFFFFF; color: #000000; font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column; position: relative">
<div style="height: 44px; flex-shrink: 0; background: #000055; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; position: relative">
<span style="color: #FFFFFF; font-size: 28px; font-weight: 700">Event</span>
<span style="position: absolute; left: 50%; transform: translateX(-50%); color: #FFFFFF; font-size: 28px; font-weight: 700">8:40p</span>
<span style="color: #AAFFFF; font-size: 22px; font-weight: 700; letter-spacing: 1px">AT SEA</span>
</div>
<div style="padding: 6px 28px 0 14px; display: flex; flex-direction: column">
<div style="font-size: 48px; line-height: 50px; font-weight: 700">Late Night Comedy</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700; color: #555555">Comedy Live</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700">Deck 4 · Fore</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700; color: #555555">↓5 decks from cabin</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700">10:00p - 11:00p · 1 h</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700">Arrive by 9:45p</div>
<div style="font-size: 34px; line-height: 38px; font-weight: 700; color: #AA5500">Ages 18+</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700; color: #555555">Bring SeaPass · Sign up at venue</div>
</div>
<div style="position: absolute; right: 8px; top: 56px; width: 2px; height: 388px; background: #AAAAAA"></div>
<div style="position: absolute; right: 6px; top: 56px; width: 6px; height: 170px; border-radius: 3px; background: #555555"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":456}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
