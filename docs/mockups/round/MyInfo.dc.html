<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round My info</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 520px; height: 520px; position: relative; background: #1E1E1E; font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 520px; height: 520px; border-radius: 50%; overflow: hidden; background: #FFFFFF; color: #000000">
<div style="height: 60px; background: #555555; color: #FFFFFF; font-size: 28px; line-height: 28px; font-weight: 700; text-align: center; padding-top: 24px; box-sizing: border-box">11:40a</div>
<div style="position: absolute; left: 0; width: 520px; top: 66px; text-align: center; font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: 1px; color: #555555">MY INFO</div>
<div style="position: absolute; left: 0; width: 520px; top: 124px; text-align: center; font-size: 28px; line-height: 32px; font-weight: 700; color: #555555">Today's summary</div>
<div style="position: absolute; left: 24px; width: 472px; top: 176px; height: 140px; border-radius: 28px; background: #0055AA; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
<div style="font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: 1px">STATEROOM</div>
<div style="font-size: 56px; line-height: 60px; font-weight: 700">9150</div>
<div style="font-size: 26px; line-height: 30px; font-weight: 700">Deck 9 · Aft stairs</div>
</div>
<div style="position: absolute; left: 0; width: 520px; top: 332px; display: flex; flex-direction: column; align-items: center; text-align: center; color: #555555">
<div style="font-size: 22px; line-height: 26px; font-weight: 700; letter-spacing: 1px">MUSTER STATION</div>
<div style="font-size: 28px; line-height: 32px; font-weight: 700">B4 · Deck 4</div>
<div style="width: 220px; height: 2px; background: #AAAAAA; margin: 10px 0"></div>
<div style="font-size: 22px; line-height: 26px; font-weight: 700; letter-spacing: 1px">DINING ROOM</div>
<div style="font-size: 28px; line-height: 32px; font-weight: 700">Not set</div>
</div>
</div>
<sc-if value="{{safe}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 76px; top: 76px; width: 368px; height: 368px; border: 2px dashed #FF5555; box-sizing: border-box"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"safe":{"editor":"boolean","default":false},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return { safe: this.props.safe ?? false };
}
}
</script>
</body>
</html>
