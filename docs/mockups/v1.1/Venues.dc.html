<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Venues list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap">
<style>
body{margin:0;background:#F4FBFA}
a{color:#006A6A}a:hover{color:#004F4F}
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4FBFA; color: #161D1D; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; position: relative">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 4px">
<a href="Cruise.dc.html" aria-label="Back to Cruise" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #161D1D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 500; flex-grow: 1">Ship venues</h1>
<button style="height: 40px; padding: 0 24px; border: 0; border-radius: 20px; background: #006A6A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">Save</button>
</header>
<div style="padding: 0 16px 8px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<label style="height: 48px; border-radius: 24px; background: #E3E9E9; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #3F4948">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search venues" placeholder="Search venues" value="{{q}}" onChange="{{onSearch}}" style="border: 0; background: transparent; outline: none; flex-grow: 1; font-family: inherit; font-size: 16px; color: #161D1D; min-width: 0">
</label>
<div style="display: flex; gap: 8px; align-items: center">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="Group by" style="display: flex; gap: 2px; align-items: center">
<span style="font-size: 12px; color: #3F4948; margin-right: 8px">Group by</span>
<sc-for list="{{groupBtns}}" as="g" hint-placeholder-count="2">
<button onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="{{g.style}}">{{g.label}}</button>
</sc-for>
</div>
</div>
<main style="flex-grow: 1; overflow-y: auto; padding: 4px 12px 96px; display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; color: #3F4948; font-size: 14px">No venues match. Venues that aren't in the table yet show up under "To check" once an event uses them.</div>
</sc-if>
<sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 8px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #006A6A">{{grp.title}}</h2>
<span style="font-size: 12px; color: #3F4948">{{grp.count}}</span>
</div>
<div style="background: #EFF5F4; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{grp.items}}" as="v" hint-placeholder-count="3">
<a href="VenueEdit.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px 8px 16px; text-decoration: none; color: #161D1D; border-top: {{v.border}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 16px; font-weight: 500">{{v.name}}</span>
<span style="font-size: 13px; color: #3F4948">{{v.sub}}</span>
</div>
<sc-if value="{{v.isCheck}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink: 0; height: 26px; padding: 0 10px; border: 1px solid #6F7979; border-radius: 13px; color: #3F4948; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .6-1.5 1.2-1.5 2.5M12 17h.01"></path></svg>Check</span>
</sc-if>
<sc-if value="{{v.isEdited}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink: 0; height: 26px; padding: 0 10px; border-radius: 13px; background: #FFDDB5; color: #2A1700; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>Edited</span>
</sc-if>
<sc-if value="{{v.isBlank}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink: 0; height: 26px; padding: 0 10px; border-radius: 13px; background: #E3E9E9; color: #3F4948; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</span>
</sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F7979" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
</section>
</sc-for>
</main>
<a href="VenueEdit.dc.html" style="position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px; border-radius: 18px; background: #9CF1F0; color: #002020; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.18)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Review 12</a>
<nav aria-label="Settings sections" style="height: 80px; flex-shrink: 0; background: #E9EFEE; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; box-sizing: border-box">
<a href="Cruise.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #051F1F; text-decoration: none; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 32px; border-radius: 16px; background: #CCE8E7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l2 3h14l2-3M5 17v-7h14v7M8 10V6h8v4M12 3v3"></path></svg></span>Cruise</a>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Days</button>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></span>Filters</button>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg></span>Events</button>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></span>Me</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startFilter":{"editor":"enum","options":["all","check","edited"],"default":"all"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: null, group: 'area', q: '' };
  }
  renderVals() {
    const V = [
      ['Royal Promenade', 5, 'Mid', 'Royal Promenade', 'builtin'],
      ['Boleros', 5, 'Mid', 'Royal Promenade', 'builtin'],
      ['Schooner Bar', 5, 'Aft', 'Royal Promenade', 'check'],
      ['Regalia Fine Jewelry', 5, 'Mid', 'Royal Promenade', 'builtin'],
      ['Cartier', 5, 'Mid', 'Royal Promenade', 'edited'],
      ['Focus Photo Gallery', 5, 'Fore', 'Royal Promenade', 'check'],
      ['On Air', 4, 'Aft', 'Entertainment Place', 'builtin'],
      ['Dazzles', 4, 'Mid', 'Entertainment Place', 'check'],
      ['Studio B', 4, 'Mid', 'Entertainment Place', 'builtin'],
      ['Casino Royale', 4, 'Mid', 'Entertainment Place', 'builtin'],
      ['Royal Theater', 4, 'Fore', 'Entertainment Place', 'edited'],
      ['Boardwalk', 6, 'Aft', 'Boardwalk', 'builtin'],
      ['AquaTheater', 6, 'Aft', 'Boardwalk', 'builtin'],
      ['Rock Climbing Wall', 6, 'Aft', 'Boardwalk', 'check'],
      ['Central Park', 8, 'Mid', 'Central Park', 'builtin'],
      ["Giovanni's Wine Bar", 8, 'Mid', 'Central Park', 'edited'],
      ['Pool Deck', 15, 'Mid', 'Pool & Sports Zone', 'builtin'],
      ['Sports Court', 16, 'Aft', 'Pool & Sports Zone', 'check'],
      ['FlowRider', 16, 'Aft', 'Pool & Sports Zone', 'builtin'],
      ['Harmony Dunes', 16, 'Aft', 'Pool & Sports Zone', 'check'],
      ['Table Tennis Court', 16, 'Aft', 'Pool & Sports Zone', 'check'],
      ['Vitality Spa', 6, 'Fore', 'Vitality Spa & Fitness', 'builtin'],
      ['Fitness Center', 6, 'Fore', 'Vitality Spa & Fitness', 'builtin'],
      ['Adventure Ocean Theater', 14, 'Fore', 'Youth Zone', 'check'],
      ['Social100 (Ages 13-17)', null, null, null, 'blank'],
      ['NextCruise Office', null, null, null, 'blank'],
      ['Prince & Greene', null, null, null, 'blank'],
      ['Perfect Day at CocoCay', null, null, 'Ashore', 'builtin']
    ].map(([name, deck, pos, area, st]) => ({ name, deck, pos, area, st }));

    const filter = this.state.filter || this.props.startFilter || 'all';
    const group = this.state.group;
    const q = (this.state.q || '').toLowerCase();
    const needs = (v) => v.st === 'check' || v.st === 'blank';
    const nCheck = V.filter(needs).length;
    const nEdited = V.filter((v) => v.st === 'edited').length;

    const shown = V.filter((v) =>
      (filter === 'all' || (filter === 'check' && needs(v)) || (filter === 'edited' && v.st === 'edited')) &&
      (!q || v.name.toLowerCase().includes(q)));

    const subFor = (v) => {
      if (v.st === 'blank') return 'Not in the table yet';
      if (v.area === 'Ashore') return 'Ashore · no deck';
      return group === 'area' ? 'Deck ' + v.deck + ' · ' + v.pos : v.pos + ' · ' + v.area;
    };

    let keys, keyOf, titleOf;
    if (group === 'area') {
      keys = ['_blank', 'Central Park', 'Boardwalk', 'Royal Promenade', 'Pool & Sports Zone', 'Vitality Spa & Fitness', 'Entertainment Place', 'Youth Zone', 'Ashore'];
      keyOf = (v) => v.st === 'blank' ? '_blank' : v.area;
      titleOf = (k) => k === '_blank' ? 'Needs details' : k;
    } else {
      const decks = Array.from(new Set(V.filter((v) => v.deck != null).map((v) => v.deck))).sort((a, b) => a - b);
      keys = ['_blank'].concat(decks.map(String), ['Ashore']);
      keyOf = (v) => v.st === 'blank' ? '_blank' : (v.area === 'Ashore' ? 'Ashore' : String(v.deck));
      titleOf = (k) => k === '_blank' ? 'Needs details' : (k === 'Ashore' ? 'Ashore' : 'Deck ' + k);
    }
    const posRank = { Fore: 0, Mid: 1, Aft: 2 };
    const groups = keys.map((k) => {
      let items = shown.filter((v) => keyOf(v) === k);
      if (group === 'deck') items = items.slice().sort((a, b) => (posRank[a.pos] ?? 3) - (posRank[b.pos] ?? 3));
      return {
        title: titleOf(k),
        count: items.length + (items.length === 1 ? ' venue' : ' venues'),
        items: items.map((v, i) => ({
          name: v.name, sub: subFor(v),
          isCheck: v.st === 'check', isEdited: v.st === 'edited', isBlank: v.st === 'blank',
          border: i === 0 ? '0' : '1px solid #E3E9E9'
        }))
      };
    }).filter((g) => g.items.length > 0);

    const chipStyle = (on) => 'height: 36px; padding: 0 14px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; ' +
      (on ? 'background: #CCE8E7; color: #051F1F; border: 1px solid #CCE8E7;' : 'background: transparent; color: #3F4948; border: 1px solid #6F7979;');
    const chips = [
      { id: 'all', label: 'All' },
      { id: 'check', label: 'To check · ' + nCheck },
      { id: 'edited', label: 'Edited · ' + nEdited }
    ].map((c) => ({ label: c.label, pressed: String(filter === c.id), style: chipStyle(filter === c.id), pick: () => this.setState({ filter: c.id }) }));

    const segStyle = (on, first) => 'height: 36px; padding: 0 16px; border: 0; font-family: inherit; font-size: 14px; font-weight: 600; ' +
      (first ? 'border-radius: 18px 6px 6px 18px;' : 'border-radius: 6px 18px 18px 6px;') +
      (on ? 'background: #006A6A; color: #FFFFFF;' : 'background: #E3E9E9; color: #3F4948;');
    const groupBtns = [
      { id: 'area', label: 'Area' },
      { id: 'deck', label: 'Deck' }
    ].map((g, i) => ({ label: g.label, pressed: String(group === g.id), style: segStyle(group === g.id, i === 0), pick: () => this.setState({ group: g.id }) }));

    return {
      q: this.state.q,
      onSearch: (e) => this.setState({ q: e.target.value }),
      chips, groupBtns, groups,
      empty: groups.length === 0
    };
  }
}
</script>
</body>
</html>
