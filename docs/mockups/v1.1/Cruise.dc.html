<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>

<div style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4FBFA; color: #161D1D; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 20px">
<h1 style="margin: 0; font-size: 24px; font-weight: 500">Cruise</h1>
<button style="height: 40px; padding: 0 24px; border: 0; border-radius: 20px; background: #006A6A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">Save</button>

<main style="flex-grow: 1; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 12px">

<div style="font-size: 20px; font-weight: 500">Harmony of the Seas</div>
<div style="font-size: 14px; color: #3F4948">Sails Mar 6, 2027</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #3F4948">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#006A6A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>

<div style="font-size: 14px; color: #3F4948">Deck, fore/mid/aft and area for each venue</div>
</div>
</div>

<div style="background: #E3E9E9; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column">
<span style="font-size: 22px; font-weight: 600">54</span>
<span style="font-size: 12px; color: #3F4948">venues</span>
</div>
<div style="border: 1px solid #6F7979; border-radius: 16px; padding: 9px 11px; display: flex; flex-direction: column">
<span style="font-size: 22px; font-weight: 600">12</span>
<span style="font-size: 12px; color: #3F4948">to check</span>
</div>
<div style="background: #FFDDB5; color: #2A1700; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column">
<span style="font-size: 22px; font-weight: 600">3</span>
<span style="font-size: 12px">edited by you</span>
</div>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<a href="VenueEdit.dc.html" style="height: 48px; padding: 0 24px; border-radius: 24px; background: #006A6A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">Review 12</a>
<a href="Venues.dc.html" style="height: 48px; padding: 0 16px; border-radius: 24px; color: #006A6A; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center">All venues</a>
</div>
</section>
<section style="background: #EFF5F4; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 18px; font-weight: 500">Paste-in backup</h2>
<div style="font-size: 14px; color: #3F4948">Restores your stars, notes and venue edits</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #3F4948">Backup text
<textarea rows="3" placeholder="Paste backup here" style="border: 1px solid #6F7979; border-radius: 12px; padding: 12px; font-family: inherit; font-size: 14px; background: transparent; resize: none; color: #161D1D"></textarea>

<div style="display: flex">
<button style="height: 40px; padding: 0 20px; border: 0; border-radius: 20px; background: #CCE8E7; color: #051F1F; font-family: inherit; font-size: 14px; font-weight: 600">Restore</button>
</div>
</section>
</main>

<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #051F1F; font-family: inherit; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 32px; border-radius: 16px; background: #CCE8E7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l2 3h14l2-3M5 17v-7h14v7M8 10V6h8v4M12 3v3"></path></svg></span>Cruise</button>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Days</button>
