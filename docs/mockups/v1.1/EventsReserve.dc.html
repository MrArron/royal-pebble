<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Events – mark reserved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap">
<style>
body{margin:0;background:#F4FBFA}
a{color:#006A6A}a:hover{color:#004F4F}
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4FBFA; color: #161D1D; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 20px">
<h1 style="margin: 0; font-size: 24px; font-weight: 500">Events</h1>
<button style="height: 40px; padding: 0 24px; border: 0; border-radius: 20px; background: #006A6A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">Save</button>
</header>
<div style="padding: 0 16px 8px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<label style="height: 48px; border-radius: 24px; background: #E3E9E9; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #3F4948">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search events or venues" placeholder="Search events or venues" style="border: 0; background: transparent; outline: none; flex-grow: 1; font-family: inherit; font-size: 16px; color: #161D1D; min-width: 0">
</label>
<div style="display: flex; gap: 8px; overflow-x: auto">
<button style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #6F7979; background: transparent; color: #3F4948; font-family: inherit; font-size: 14px; font-weight: 600; flex-shrink: 0">Sat 12</button>
<button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #CCE8E7; background: #CCE8E7; color: #051F1F; font-family: inherit; font-size: 14px; font-weight: 600; flex-shrink: 0">Sun 13</button>
<button style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #6F7979; background: transparent; color: #3F4948; font-family: inherit; font-size: 14px; font-weight: 600; flex-shrink: 0">Mon 14</button>
<button style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #6F7979; background: transparent; color: #3F4948; font-family: inherit; font-size: 14px; font-weight: 600; flex-shrink: 0">Tue 15</button>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<main style="flex-grow: 1; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; color: #3F4948; font-size: 14px">Every starred event that needs a reservation is marked reserved.</div>
</sc-if>
<sc-for list="{{events}}" as="e" hint-placeholder-count="5">
<article style="background: #EFF5F4; border-radius: 20px; padding: 12px 4px 12px 16px; display: flex; gap: 12px; align-items: flex-start">
<div style="width: 52px; flex-shrink: 0; font-size: 14px; font-weight: 700; padding-top: 2px">{{e.time}}</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 500">{{e.title}}</span>
<span style="font-size: 13px; color: #3F4948">{{e.venue}}</span>
<sc-if value="{{e.showNeeded}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px">
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #FFDDB5; color: #2A1700; font-size: 12px; font-weight: 600; display: flex; align-items: center">Reservation needed</span>
<button onClick="{{e.toggleRes}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #CCE8E7; color: #051F1F; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Mark reserved</button>
</div>
</sc-if>
<sc-if value="{{e.showReserved}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px">
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #9CF1F0; color: #002020; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Reserved</span>
<button onClick="{{e.toggleRes}}" style="height: 40px; padding: 0 12px; border: 0; background: transparent; color: #006A6A; font-family: inherit; font-size: 14px; font-weight: 600">Not reserved</button>
</div>
</sc-if>
<sc-if value="{{e.showPlainRes}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; color: #3F4948">Reservation needed · star it to track</span>
</sc-if>
</div>
<button onClick="{{e.toggleStar}}" aria-label="{{e.starLabel}}" aria-pressed="{{e.starPressed}}" style="width: 48px; height: 48px; flex-shrink: 0; border: 0; background: transparent; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #006A6A">
<sc-if value="{{e.starred}}" hint-placeholder-val="{{ false }}">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.6 6 21l1.3-6.8-5-4.7 6.8-.8z" fill="#006A6A"></path></svg>
</sc-if>
<sc-if value="{{e.unstarred}}" hint-placeholder-val="{{ true }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F4948" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.6 6 21l1.3-6.8-5-4.7 6.8-.8z"></path></svg>
</sc-if>
</button>
</article>
</sc-for>
</main>
<nav aria-label="Settings sections" style="height: 80px; flex-shrink: 0; background: #E9EFEE; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; box-sizing: border-box">
<a href="Cruise.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; text-decoration: none; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l2 3h14l2-3M5 17v-7h14v7M8 10V6h8v4M12 3v3"></path></svg></span>Cruise</a>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Days</button>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></span>Filters</button>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #051F1F; font-family: inherit; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 32px; border-radius: 16px; background: #CCE8E7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg></span>Events</button>
<button style="background: none; border: 0; padding: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3F4948; font-family: inherit; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></span>Me</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filter: 'all',
      starred: { e2: true, e4: true },
      reserved: { e4: true }
    };
  }
  renderVals() {
    const s = this.state;
    const E = [
      { id: 'e1', time: '10:00a', title: 'Adults Only Trivia: Movies', venue: 'Studio B', res: false },
      { id: 'e2', time: '1:00p', title: 'Ice Show', venue: 'Studio B', res: true },
      { id: 'e3', time: '3:00p', title: 'FlowRider Open', venue: 'FlowRider', res: false },
      { id: 'e4', time: '7:00p', title: 'AquaTheater Show', venue: 'AquaTheater', res: true },
      { id: 'e5', time: '9:00p', title: 'Comedy Show', venue: 'On Air', res: true },
      { id: 'e6', time: '10:30p', title: 'Late Night Dance Party', venue: 'Royal Promenade', res: false }
    ];
    const needs = (e) => e.res && s.starred[e.id] && !s.reserved[e.id];
    const nNeeds = E.filter(needs).length;
    const shown = E.filter((e) => s.filter === 'all' || (s.filter === 'starred' && s.starred[e.id]) || (s.filter === 'needs' && needs(e)));
    const flip = (key, id) => this.setState({ [key]: Object.assign({}, s[key], { [id]: !s[key][id] }) });

    const events = shown.map((e) => {
      const st = !!s.starred[e.id];
      const rv = !!s.reserved[e.id];
      return {
        time: e.time, title: e.title, venue: e.venue,
        starred: st, unstarred: !st,
        starPressed: String(st), starLabel: (st ? 'Unstar ' : 'Star ') + e.title,
        showNeeded: e.res && st && !rv,
        showReserved: e.res && st && rv,
        showPlainRes: e.res && !st,
        toggleStar: () => flip('starred', e.id),
        toggleRes: () => flip('reserved', e.id)
      };
    });

    const chipStyle = (on) => 'height: 36px; padding: 0 14px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; ' +
      (on ? 'background: #CCE8E7; color: #051F1F; border: 1px solid #CCE8E7;' : 'background: transparent; color: #3F4948; border: 1px solid #6F7979;');
    const chips = [
      { id: 'all', label: 'All' },
      { id: 'starred', label: 'Starred' },
      { id: 'needs', label: 'To reserve · ' + nNeeds }
    ].map((c) => ({ label: c.label, pressed: String(s.filter === c.id), style: chipStyle(s.filter === c.id), pick: () => this.setState({ filter: c.id }) }));

    return { chips, events, empty: events.length === 0 };
  }
}
</script>
</body>
</html>
